
name: Build Kyw3ll Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
        
      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Copy Kyw3ll Studio
        run: npx cap copy android

      - name: Add microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          marker = '<application'
          additions = '\n'.join(permissions) + '\n\n'

          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, additions + marker, 1)

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kyw3ll-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
